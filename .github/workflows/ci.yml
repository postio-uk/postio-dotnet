name: CI

on:
  push:
    branches: [stage, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Tests (offline)
        run: dotnet test -c Release --no-build --filter "Category!=Live" --logger "console;verbosity=normal"

  live-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Live tests against stage
        env:
          POSTIO_API_KEY_STAGE: ${{ secrets.POSTIO_API_KEY_STAGE }}
        run: dotnet test -c Release --filter "Category=Live" --logger "console;verbosity=normal"
