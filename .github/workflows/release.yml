name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      already-published: ${{ steps.check.outputs.already-published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/Postio.Sdk/Postio.Sdk.csproj | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match csproj Version $VERSION"
            exit 1
          fi

      - name: Check if already on NuGet (idempotent)
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/postio.sdk/$VERSION/postio.sdk.$VERSION.nupkg")
          if [ "$STATUS" = "200" ]; then
            echo "Postio.Sdk $VERSION already on NuGet — skipping publish"
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore + build + offline tests
        if: steps.check.outputs.already-published == 'false'
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet test -c Release --no-build --filter "Category!=Live"

      - name: Pack
        if: steps.check.outputs.already-published == 'false'
        run: dotnet pack src/Postio.Sdk/Postio.Sdk.csproj -c Release --no-build -o artifacts

      - name: Upload artifact
        if: steps.check.outputs.already-published == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/

  publish:
    needs: build
    if: needs.build.outputs.already-published == 'false'
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Postio.Sdk
    permissions:
      id-token: write  # NuGet Trusted Publishers (OIDC)
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts/

      - name: Exchange OIDC token for short-lived NuGet API key
        uses: NuGet/login@v1
        id: login
        with:
          user: postio

      - name: Publish to NuGet
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
